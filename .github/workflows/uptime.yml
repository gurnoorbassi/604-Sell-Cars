name: Production health

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production
        id: check
        continue-on-error: true
        run: curl --fail --silent --show-error --max-time 20 https://dealership-inventory-board.netlify.app/api/health
      - name: Open one alert issue
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[Alert] Inventory app health check failed";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            if (!issues.some((issue) => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `The hourly production health check failed at ${new Date().toISOString()}.\n\nCheck Netlify Functions and Supabase service health.`,
              });
            }
      - name: Fail workflow
        if: steps.check.outcome == 'failure'
        run: exit 1
